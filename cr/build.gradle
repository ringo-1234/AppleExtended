jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.class'
        include '**/*.kotlin_module'
        include 'assets/**'
        include 'META-INF/services/**'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'mcmod.info'
    }

    manifest {
        attributes([
                "Specification-Title": "apple-rtm",
                "Specification-Vendor": "apple-rtm",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"apple-rtm",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "FMLCorePlugin": "jp.apple.asm.AppleCoreMod",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true",
                "FMLAT": "fix-rtm_at.cfg"
        ])
    }
}

def mergedGraalServicesDir = file("${project.layout.buildDirectory.get()}/generated/graal-services")

tasks.register('generateGraalServiceDescriptors') {
    inputs.files(configurations.graalJsRuntime)
    outputs.dir(mergedGraalServicesDir)

    doLast {
        delete mergedGraalServicesDir
        mergedGraalServicesDir.mkdirs()

        Map<String, LinkedHashSet<String>> merged = new LinkedHashMap<>()

        configurations.graalJsRuntime.files.each { File dependencyJar ->
            if (!dependencyJar.name.endsWith('.jar')) {
                return
            }

            java.util.zip.ZipFile zipFile = new java.util.zip.ZipFile(dependencyJar)
            try {
                java.util.Enumeration<? extends java.util.zip.ZipEntry> entries = zipFile.entries()
                while (entries.hasMoreElements()) {
                    java.util.zip.ZipEntry entry = entries.nextElement()
                    if (entry.isDirectory()) {
                        continue
                    }
                    if (!entry.name.startsWith('META-INF/services/')) {
                        continue
                    }

                    LinkedHashSet<String> lines = merged.computeIfAbsent(entry.name) { new LinkedHashSet<String>() }
                    String text = zipFile.getInputStream(entry).getText('UTF-8')
                    text.readLines()
                            .collect { it.trim() }
                            .findAll { it && !it.startsWith('#') }
                            .each { lines.add(it) }
                }
            } finally {
                zipFile.close()
            }
        }

        merged.each { String servicePath, LinkedHashSet<String> lines ->
            File outputFile = new File(mergedGraalServicesDir, servicePath)
            outputFile.parentFile.mkdirs()
            outputFile.setText(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}

tasks.register('graalLibsJar', Jar) {
    dependsOn tasks.named('generateGraalServiceDescriptors')

    archiveBaseName = graalLibsBaseName
    archiveVersion = "${version}"
    archiveClassifier = ''
    destinationDirectory = file("${project.layout.buildDirectory.get()}/libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                "Multi-Release": "true"
        ])
    }

    from {
        configurations.graalJsRuntime.files
                .findAll { it.name.endsWith('.jar') }
                .collect { zipTree(it) }
    } {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/**/module-info.class'
    }

    from(mergedGraalServicesDir) {
        include 'META-INF/services/**'
    }
}

tasks.register('copyJarToTest', Copy) {
    dependsOn tasks.named('jar')
    dependsOn tasks.named('reobfJar')
    dependsOn tasks.named('graalLibsJar')
    from "${project.layout.buildDirectory.get()}/libs"
    into "/Users/S/Library/Application Support/PrismLauncher/instances/CleanRoom/minecraft/mods"
    include "${base.archivesName.get()}-${version}.jar"
    include "${graalLibsBaseName}-${version}.jar"
}

tasks.named('build') {
    dependsOn tasks.named('copyJarToTest')
    dependsOn tasks.named('graalLibsJar')
}

tasks.matching { it.name == 'compilePatchedMcKotlin' }.configureEach {
    dependsOn tasks.matching { it.name == 'decompressDecompiledSources' }
}
tasks.matching { it.name == 'compileInjectedTagsKotlin' }.configureEach {
    dependsOn tasks.matching { it.name == 'injectTags' }
}
tasks.matching { it.name == 'compileMcLauncherKotlin' }.configureEach {
    dependsOn tasks.matching { it.name == 'createMcLauncherFiles' }
}
tasks.register('printKotlinClasspath') {
    doLast {
        println "=== compileKotlin classpath ==="
        tasks.named('compileKotlin', org.jetbrains.kotlin.gradle.tasks.KotlinCompile).get().libraries.files.each {
            println it
        }
    }
}
tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    compilerOptions {
        languageVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
        apiVersion = org.jetbrains.kotlin.gradle.dsl.KotlinVersion.KOTLIN_1_9
    }
}