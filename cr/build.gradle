plugins {
    id 'java'
    id 'eclipse'
    id 'maven-publish'
    id 'org.jetbrains.kotlin.jvm' version '2.1.0'
    id 'com.gtnewhorizons.retrofuturagradle' version '2.0.3'
}

repositories {
    maven {
        name = 'CurseMaven'
        url = 'https://cursemaven.com'
    }
    maven { url = 'https://cleanroommc.com' }
    maven { url = 'https://minecraftforge.net' }
}

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName = 'AppleExtended-forge1.12.2-cleanroom'
}

ext {
    graalJsVersion = '25.0.2'
    graalLibsBaseName = 'AppleExtended-GraalLibs-forge1.12.2'
}

configurations {
    graalJsRuntime
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(8)
    }
}

sourceSets {
    main {
        java {
            srcDirs = [
                    file("${rootProject.projectDir}/src/main/java"),
                    file("${rootProject.projectDir}/fixrtm/src/main/java"),
                    file("src/main/java")
            ]
            exclude { it.file.absolutePath == "${rootProject.projectDir}/src/main/java/jp/ngt/ngtlib/io/ScriptUtil.java" }
        }
        kotlin {
            srcDirs = [
                    file("${rootProject.projectDir}/src/main/java"),
                    file("${rootProject.projectDir}/fixrtm/src/main/java"),
                    file("src/main/java"),
                    file("src/main/kotlin")
            ]
        }
        resources {
            srcDirs = [
                    file("${rootProject.projectDir}/src/main/resources"),
                    file("${rootProject.projectDir}/fixrtm/src/main/resources"),
                    file("src/main/resources")
            ]
        }
    }
}

minecraft {
    mcVersion = '1.12.2'
    mcpMappingChannel = 'snapshot'
    mcpMappingVersion = '20171003'
    useDependencyAccessTransformers = true
}

def atFile = rootProject.file('src/main/resources/META-INF/fix-rtm_at.cfg')
if (atFile.exists()) {
    tasks.named('applyJST').configure {
        accessTransformerFiles.from(atFile)
    }
}

dependencies {
    //compileOnly fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])
    compileOnly "curse.maven:replaymod-775651:4798232"

    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.7.2'
    implementation 'com.anatawa12.sai:sai:0.0.2'

    implementation 'io.sigpipe:jbsdiff:1.0'
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'

