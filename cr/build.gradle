buildscript {
    repositories {
        maven { url = 'https://maven.minecraftforge.net' }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:3.+'
    }
}

apply plugin: 'net.minecraftforge.gradle'
apply plugin: 'eclipse'
apply plugin: 'maven-publish'

version = '2.4.4'
group = 'jp.apple.rtm'
archivesBaseName = 'AppleExtended-Added-forge1.12.2-cleanroom'

ext {
    graalJsVersion = '25.0.2'
    graalLibsBaseName = 'AppleExtended-GraalLibs-forge1.12.2'
}

configurations {
    graalJsRuntime
}

sourceCompatibility = 1.8
targetCompatibility = 1.8

tasks.register('mergeSources', Copy) {
    from file("${rootProject.projectDir}/src/main/java")
    into file("${project.buildDir}/src/merged/java")

    from file("src/main/java")
    into file("${project.buildDir}/src/merged/java")

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.register('mergeResources', Copy) {
    from file("${rootProject.projectDir}/src/main/resources")
    into file("${project.buildDir}/src/merged/resources")

    from file("src/main/resources")
    into file("${project.buildDir}/src/merged/resources")

    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

sourceSets {
    main {
        java {
            srcDirs = [file("${project.buildDir}/src/merged/java")]
        }
        resources {
            srcDirs = [file("${project.buildDir}/src/merged/resources")]
        }
    }
}

tasks.named('compileJava') {
    dependsOn mergeSources
}
tasks.named('processResources') {
    dependsOn mergeResources
}

minecraft {
    mappings channel: 'snapshot', version: '20171003-1.12'

    accessTransformer = file("${rootProject.projectDir}/src/main/resources/META-INF/fix-rtm_at.cfg")

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'SCAN,REGISTRIES,REGISTRYDUMP'
            property 'forge.logging.console.level', 'debug'
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.12.2-14.23.5.2860'

    compileOnly fileTree(dir: "${rootProject.projectDir}/libs", include: ['*.jar'])
    compileOnly files("${rootProject.projectDir}/libs/core.jar")

    implementation 'io.sigpipe:jbsdiff:1.0'
    implementation 'org.sejda.imageio:webp-imageio:0.1.6'

    runtimeOnly "org.graalvm.js:js-scriptengine:${graalJsVersion}"
    runtimeOnly "org.graalvm.polyglot:js:${graalJsVersion}"

    graalJsRuntime "org.graalvm.js:js-scriptengine:${graalJsVersion}"
    graalJsRuntime "org.graalvm.polyglot:js:${graalJsVersion}"

    implementation 'org.codehaus.groovy:groovy-jsr223:2.5.23'
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    from(sourceSets.main.resources.srcDirs) {
        include '**/*.class'
        include '**/*.kotlin_module'
        include 'assets/**'
        include 'META-INF/services/**'
        exclude 'META-INF/MANIFEST.MF'
        exclude 'mcmod.info'
    }

    manifest {
        attributes([
                "Specification-Title": "apple-rtm",
                "Specification-Vendor": "apple-rtm",
                "Specification-Version": "1",
                "Implementation-Title": project.name,
                "Implementation-Version": "${version}",
                "Implementation-Vendor" :"apple-rtm",
                "Implementation-Timestamp": new Date().format("yyyy-MM-dd'T'HH:mm:ssZ"),
                "FMLCorePlugin": "com.anatawa12.fixRtm.asm.FixRtmCorePlugin",
                "FMLCorePluginContainsFMLMod": "true",
                "ForceLoadAsMod": "true",
                "FMLAT": "fix-rtm_at.cfg"
        ])
    }
}

def mergedGraalServicesDir = file("$buildDir/generated/graal-services")

task generateGraalServiceDescriptors {
    inputs.files(configurations.graalJsRuntime)
    outputs.dir(mergedGraalServicesDir)

    doLast {
        delete mergedGraalServicesDir
        mergedGraalServicesDir.mkdirs()

        Map<String, LinkedHashSet<String>> merged = new LinkedHashMap<>()

        configurations.graalJsRuntime.files.each { File dependencyJar ->
            if (!dependencyJar.name.endsWith('.jar')) {
                return
            }

            java.util.zip.ZipFile zipFile = new java.util.zip.ZipFile(dependencyJar)
            try {
                java.util.Enumeration<? extends java.util.zip.ZipEntry> entries = zipFile.entries()
                while (entries.hasMoreElements()) {
                    java.util.zip.ZipEntry entry = entries.nextElement()
                    if (entry.isDirectory()) {
                        continue
                    }
                    if (!entry.name.startsWith('META-INF/services/')) {
                        continue
                    }

                    LinkedHashSet<String> lines = merged.computeIfAbsent(entry.name) { new LinkedHashSet<String>() }
                    String text = zipFile.getInputStream(entry).getText('UTF-8')
                    text.readLines()
                            .collect { it.trim() }
                            .findAll { it && !it.startsWith('#') }
                            .each { lines.add(it) }
                }
            } finally {
                zipFile.close()
            }
        }

        merged.each { String servicePath, LinkedHashSet<String> lines ->
            File outputFile = new File(mergedGraalServicesDir, servicePath)
            outputFile.parentFile.mkdirs()
            outputFile.setText(lines.join('\n') + '\n', 'UTF-8')
        }
    }
}

task graalLibsJar(type: Jar) {
    dependsOn generateGraalServiceDescriptors

    archiveBaseName = graalLibsBaseName
    archiveVersion = "${version}"
    archiveClassifier = ''
    destinationDirectory = file("$buildDir/libs")
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    manifest {
        attributes([
                "Multi-Release": "true"
        ])
    }

    from {
        configurations.graalJsRuntime.files
                .findAll { it.name.endsWith('.jar') }
                .collect { zipTree(it) }
    } {
        exclude 'META-INF/MANIFEST.MF'
        exclude 'META-INF/INDEX.LIST'
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/services/**'
        exclude 'module-info.class'
        exclude 'META-INF/versions/**/module-info.class'
    }

    from(mergedGraalServicesDir) {
        include 'META-INF/services/**'
    }
}

jar.finalizedBy('reobfJar')

task copyJarToTest(type: Copy) {
    dependsOn 'reobfJar'
    dependsOn 'graalLibsJar'
    from "build/libs"
    into "/Users/S/Library/Application Support/PrismLauncher/instances/CleanRoom/minecraft/mods"
    include "${archivesBaseName}-${version}.jar"
    include "${graalLibsBaseName}-${version}.jar"
}

build.dependsOn copyJarToTest
build.dependsOn graalLibsJar
